<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SH | Portāls</title>
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SH Portāls">
<meta name="author" content="VAITKEVIX, SIA">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://aizvietosana-api.vaitkevix.workers.dev">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('sh_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#f1f4f2;--surface:#fff;--surface-2:#f5f7f6;--line:rgba(20,40,32,.09);--line-2:#d6ddd9;--ink:#17201c;--ink-2:#47504c;--ink-3:#6d7672;
  --brand:#0f6b5c;--brand-2:#13897a;--brand-soft:rgba(15,107,92,.1);--warn:#c2410c;--red:#c02626;--r:16px;--shadow:0 1px 2px rgba(16,32,26,.06),0 8px 24px -12px rgba(16,32,26,.18)}
:root[data-theme="dark"]{--bg:#0b120f;--surface:#151d1a;--surface-2:#1b2521;--line:rgba(255,255,255,.08);--line-2:#2b3833;--ink:#eef2ef;--ink-2:#b4bdb8;--ink-3:#8b958f;
  --brand:#22a08c;--brand-2:#2bb9a3;--brand-soft:rgba(34,160,140,.16);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Augšjosla */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{width:38px;height:38px;border-radius:11px;flex:none;display:block}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:1px 0 0;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;box-shadow:0 1px 0 var(--line)}
.icon-btn:active{transform:scale(.94)}
.back{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink)}

/* Ieeja */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.lcard{width:min(380px,100%);padding:28px 22px 20px;text-align:center;animation:up .35s ease-out}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.lcard img{width:68px;height:68px;border-radius:16px;margin:0 auto 14px;display:block}
.lcard h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.lcard .sub{margin:0 0 18px;color:var(--ink-3);font-weight:600;font-size:14px}
.pin{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);text-align:center;font-size:24px;font-weight:800;letter-spacing:.35em;outline:none}
.pin:focus{border-color:var(--brand)}
.lcard .err{min-height:20px;margin:10px 0 4px;color:var(--red);font-weight:700;font-size:13.5px}
.btn{height:50px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;width:100%}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--red);border:1px solid var(--line)}
.copy{margin:16px 0 0;font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Sākums */
.hello{padding:8px 0 16px}
.hello .d{font-size:13px;font-weight:700;color:var(--ink-3);text-transform:capitalize}
.hello h2{margin:4px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;gap:12px;padding:16px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s;width:100%}
.tile:active{transform:scale(.985)}
.tile .h{display:flex;align-items:center;gap:12px}
.tile .h img,.tile .h .ic{width:46px;height:46px;border-radius:13px;flex:none;object-fit:cover}
.tile .h .ic{display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tile .h b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.tile .h small{display:block;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-top:1px}
.tile .h .go{margin-left:auto;color:var(--ink-3)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.st{flex:1 1 0;min-width:84px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.st b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.st span{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-top:2px}
.st.warn b{color:var(--warn)}
.st.ok b{color:var(--brand)}
.skel{height:56px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* Lietotne rāmī */
.appv{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
.appbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .t{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frames{position:relative;flex:1}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.sw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
@media(max-width:560px){.appbar .t{display:none}}
.sw::-webkit-scrollbar{display:none}
.sw button{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid transparent;padding:0;background:none;overflow:hidden}
.sw button.on{border-color:var(--brand)}
.sw img{width:100%;height:100%;display:block}

/* Lapas (izvēlne, pilnvaras) */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,20,16,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sup .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.sheet{border-radius:20px}}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sheet .hd h3{margin:0;flex:1;font-size:19px;font-weight:800;letter-spacing:-.01em}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);font-size:20px;line-height:1}
.menu{display:grid;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-align:left}
.menu button.red{color:var(--red)}
.who{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--brand-soft);margin:0 0 12px;font-weight:800}
.who small{display:block;font-weight:600;font-size:12.5px;color:var(--ink-3)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink-3)}

/* Pilnvaras */
.adm-top{display:flex;gap:8px;margin:0 0 12px}
.adm-top input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;outline:none;min-width:0}
.adm-top .btn{width:auto;height:44px;padding:0 16px;font-size:14.5px}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.prow.off{opacity:.5}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:800;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip.a{background:var(--brand-soft);color:var(--brand)}
.f{margin:0 0 14px}
.f label{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin:0 0 6px}
.f input[type=text],.f input[type=tel]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;outline:none;font-weight:700}
.f input:focus{border-color:var(--brand)}
.row2{display:flex;gap:8px}
.row2 .btn{width:auto;padding:0 14px;height:46px;font-size:14px;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:6px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13.5px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.colors button.on{border-color:var(--ink)}
.perm{padding:12px;border-radius:12px;background:var(--surface-2);margin:0 0 8px}
.perm .pt{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:0 0 8px}
.perm .pt img{width:22px;height:22px;border-radius:6px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-weight:700;margin:0 0 8px}
.tog input{width:22px;height:22px;accent-color:var(--brand)}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#17201c;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);animation:up .25s}
.toast.err{background:var(--red)}
.foot{padding:8px 0 calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3)}
</style>
</head>
<body>

<!-- Ieeja -->
<section id="vLogin" class="login" hidden>
  <form class="card lcard" id="loginForm" autocomplete="on">
    <img src="icon.png" alt="">
    <h2>SH | Portāls</h2>
    <p class="sub">Visas darba lietotnes vienuviet</p>
    <input type="text" name="username" autocomplete="username" value="SH portāls" hidden>
    <input class="pin" id="pin" type="password" name="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" type="submit">Ienākt</button>
    <p class="copy">© VAITKEVIX, SIA</p>
  </form>
</section>

<!-- Sākums -->
<section id="vHome" hidden>
  <header class="top"><div class="wrap">
    <img class="logo" src="icon.png" alt="">
    <div class="brand"><h1>SH | Portāls</h1><p id="meLine"></p></div>
    <button class="icon-btn" id="refreshBtn" title="Atjaunot" aria-label="Atjaunot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    <button class="icon-btn" id="menuBtn" title="Izvēlne" aria-label="Izvēlne"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div></header>
  <main class="wrap">
    <div class="hello"><div class="d" id="today"></div><h2 id="hi"></h2></div>
    <div class="grid" id="tiles"></div>
  </main>
  <div class="foot">© VAITKEVIX, SIA</div>
</section>

<!-- Lietotne -->
<section class="appv" id="vApp" hidden>
  <div class="appbar">
    <button class="back" id="backBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Sākums</button>
    <div class="t" id="appTitle"></div>
    <div class="sw" id="appSw"></div>
  </div>
  <div class="frames" id="frames"></div>
</section>

<script>
/* SH | Portāls — © VAITKEVIX, SIA */
const API = 'https://aizvietosana-api.vaitkevix.workers.dev/portal';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { t: ls.get('sh_t'), me: null, dash: null, people: [], roles: null, frames: {} };

const APPS = {
  aizv: { name: 'Aizvietošana', sub: 'Aizvietošanas un papilddarbi', path: '/shaizvietosana/' },
  izv:  { name: 'Izvešana', sub: 'Lapas · zari · bio', path: '/shizvesana/' },
  kais: { name: 'Kaisāmmateriāls', sub: 'Sāls · smilts · mix', path: '/shkaisammaterials/' },
  pers: { name: 'Personāls', sub: 'Pieņemšana darbā · atvaļinājumi', path: '/shpersonals/' },
  budz: { name: 'Budžets', sub: 'Uzkopšanas tāmes', path: '/shbudzets/' }
};
const ORDER = ['aizv', 'izv', 'kais', 'pers', 'budz'];
const icon = (k) => APPS[k].path + 'icon.png';
const RL = { admin: 'Administrators', vaditajs: 'Darbu vadītājs', pieteicejs: 'Pieteicējs', 'gatavotājs': 'Gatavotājs', 'vadība': 'Vadība' };
const COLORS = ['#0f6b5c', '#2563eb', '#7c3aed', '#db2777', '#dc2626', '#ea580c', '#ca8a04', '#16a34a', '#0891b2', '#475569'];

function toast(m, type) { const t = document.createElement('div'); t.className = 'toast' + (type === 'err' ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, t: S.t }, data || {})) });
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Kļūda'); e.code = j.code; throw e; }
  return j;
}
const netMsg = (e) => /fetch|network|load failed/i.test(e.message) ? 'Nav interneta savienojuma' : e.message;

/* ---------- Ieeja / iziešana ---------- */
function show(v) { ['vLogin', 'vHome', 'vApp'].forEach(id => $(id).hidden = id !== v); }
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const pin = $('pin').value.trim(); if (!pin) return $('pin').focus();
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Pārbauda…'; $('loginErr').textContent = '';
  try {
    const r = await api('login', { pin });
    S.t = r.token; ls.set('sh_t', r.token); ls.set('sh_pin', pin);
    S.me = r.me; S.dash = r.dash; ls.set('sh_me', JSON.stringify(r.me)); sso(pin);
    try { if (window.PasswordCredential && navigator.credentials) navigator.credentials.store(new PasswordCredential({ id: 'SH portāls', password: pin })).catch(() => {}); } catch (e) {}
    $('pin').value = ''; home(); maybeTour();
  } catch (err) {
    $('loginErr').textContent = netMsg(err); $('pin').value = '';
    const c = $('loginForm'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); $('pin').focus();
  } finally { $('loginBtn').disabled = false; $('loginBtn').textContent = 'Ienākt'; }
};
/** Vienota ieeja: lietotnes uz šī paša domēna saņem pieteikšanos automātiski */
function sso(pin) {
  const P = S.me.perms;
  if (P.aizv) ls.set('darbi_pin', pin);
  ['izv', 'kais'].forEach(k => {
    if (P[k]) ls.set('shx_' + k + '_user', JSON.stringify({ name: S.me.name, role: P[k], kind: P[k] === 'admin' ? 'admin' : 'pieteicejs', kindLabel: P[k] === 'admin' ? 'Administrators' : 'Pieteicējs' }));
    else ls.del('shx_' + k + '_user');
  });
  if (P.pers) { ls.set('personals_pin', pin); ls.set('personals_login', ''); } else ls.del('personals_pin');
  if (P.budz) { ls.set('budzets_pin', pin); ls.del('budzets_user'); } else ls.del('budzets_pin');
}
async function logout() {
  try { await api('logout'); } catch (e) {}
  ['sh_t', 'sh_pin', 'sh_me', 'darbi_pin', 'shx_izv_user', 'shx_kais_user', 'personals_pin', 'budzets_pin', 'budzets_user', 'budzets_list'].forEach(ls.del);
  S.t = null; S.me = null; Object.values(S.frames).forEach(f => f.remove()); S.frames = {};
  closeSheet(); history.replaceState(null, '', location.pathname); show('vLogin'); setTimeout(() => $('pin').focus(), 150);
}

/* ---------- Sākums ---------- */
function apps() { return ORDER.filter(k => S.me && S.me.perms[k]); }
function home() {
  show('vHome');
  const d = new Date();
  $('today').textContent = d.toLocaleDateString('lv-LV', { weekday: 'long', day: 'numeric', month: 'long' });
  const h = d.getHours();
  $('hi').textContent = (h < 11 ? 'Labrīt' : h < 18 ? 'Labdien' : 'Labvakar') + ', ' + S.me.name.split(' ')[0] + '!';
  $('meLine').textContent = S.me.name + (S.me.admin ? ' · administrators' : '');
  const list = apps();
  $('tiles').innerHTML = list.map(k => `
    <button class="tile" data-app="${k}">
      <div class="h"><img src="${icon(k)}" alt=""><div><b>${APPS[k].name}</b><small>${esc(RL[S.me.perms[k]] || '')} · ${APPS[k].sub}</small></div>
        <svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="stats" id="st-${k}">${statsHtml(k)}</div>
    </button>`).join('') + (S.me.admin ? `
    <button class="tile" id="admTile">
      <div class="h"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3Z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <div><b>Administrēšana</b><small>Cilvēki, pilnvaras, objekti, uzņēmumi, saraksti</small></div>
        <svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </button>` : '') + (list.length ? '' : '<div class="card" style="padding:20px;text-align:center;font-weight:700;color:var(--ink-3)">Jums vēl nav piešķirta neviena lietotne. Sazinieties ar administratoru.</div>');
}
function st(n, label, cls) { return `<div class="st ${cls || ''}"><b>${n == null ? '—' : n}</b><span>${label}</span></div>`; }
function statsHtml(k) {

function openApp(k, noPush) {
  if (!S.me || !S.me.perms[k]) return;
  show('vApp'); $('appTitle').textContent = APPS[k].name;
  const pin = ls.get('sh_pin'); if (pin) sso(pin);
  if (!S.frames[k]) { const f = document.createElement('iframe'); f.src = APPS[k].path; f.title = APPS[k].name; f.allow = 'geolocation; camera; clipboard-write'; $('frames').appendChild(f); S.frames[k] = f; }
  Object.keys(S.frames).forEach(x => S.frames[x].hidden = x !== k);
  $('appSw').innerHTML = apps().map(x => `<button data-sw="${x}" class="${x === k ? 'on' : ''}" title="${APPS[x].name}"><img src="${icon(x)}" alt="${APPS[x].name}"></button>`).join('');
  if (!noPush) history.pushState({ app: k }, '', '#' + k);
}
$('appSw').onclick = (e) => { const b = e.target.closest('[data-sw]'); if (b) openApp(b.dataset.sw, true), history.replaceState({ app: b.dataset.sw }, '', '#' + b.dataset.sw); };

      <div class="row2" style="gap:8px"><div class="f" style="flex:1"><label for="pTel">Tālrunis</label><input type="tel" id="pTel" value="${esc(p.phone || '')}"></div><div class="f" style="flex:1.4"><label for="pMail">E-pasts</label><input type="text" id="pMail" inputmode="email" value="${esc(p.email || '')}"></div></div>
      <div class="f"><label>Krāsa</label><div class="colors">${COLORS.map(c => `<button type="button" data-c="${c}" class="${c === p.color ? 'on' : ''}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div></div>
      <label class="tog">Aktīvs<input type="checkbox" id="pAct" ${p.active ? 'checked' : ''}></label>
      <label class="tog">Portāla administrators (maina pilnvaras)<input type="checkbox" id="pAdm" ${p.perms.portal === 'admin' ? 'checked' : ''}></label>
      ${ORDER.map(k => `<div class="perm"><div class="pt"><img src="${icon(k)}" alt="">${APPS[k].name}</div><div class="seg" data-k="${k}">
        ${S.roles[k].map(r => `<button type="button" data-r="${esc(r)}" class="${(p.perms[k] || '') === r ? 'on' : ''}">${r ? esc(RL[r] || r) : 'Nav piekļuves'}</button>`).join('')}</div></div>`).join('')}
      <div class="acts">${isNew ? '' : '<button class="btn red" id="pDel" type="button">Dzēst</button>'}<button class="btn" id="pSave" type="button">Saglabāt</button></div>`;
    $('pBack').onclick = () => drawAdminSheet();
    $('pGen').onclick = () => { p.name = $('pName').value; p.phone = $('pTel').value; p.email = $('pMail').value; p.pin = genPin(); draw(); };
    s.querySelector('.colors').onclick = (e) => { const b = e.target.closest('[data-c]'); if (b) { p.name = $('pName').value; p.pin = $('pPin').value; p.phone = $('pTel').value; p.email = $('pMail').value; p.color = b.dataset.c; draw(); } };
    s.querySelectorAll('.seg').forEach(g => g.onclick = (e) => { const b = e.target.closest('[data-r]'); if (!b) return; p.perms[g.dataset.k] = b.dataset.r; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
    $('pSave').onclick = async () => {
      p.name = $('pName').value.trim(); p.pin = $('pPin').value.trim(); p.phone = $('pTel').value.trim(); p.email = $('pMail').value.trim(); p.active = $('pAct').checked; p.perms.portal = $('pAdm').checked ? 'admin' : '';
      const b = $('pSave'); b.disabled = true; b.textContent = 'Saglabā…';
      try { const r = await api('save', { person: Object.assign({}, p, { oldName: old }) }); S.people = r.people; toast('Saglabāts'); drawAdminSheet(); refresh(true); }
      catch (e) { toast(netMsg(e), 'err'); b.disabled = false; b.textContent = 'Saglabāt'; }
    };
    if ($('pDel')) $('pDel').onclick = async () => {
      if (!confirmDel()) return;
      try { const r = await api('del', { name: old }); S.people = r.people; toast('Dzēsts'); drawAdminSheet(); } catch (e) { toast(netMsg(e), 'err'); }
    };
  };
  let armed = false; function confirmDel() { if (armed) return true; armed = true; const b = $('pDel'); b.textContent = 'Spiediet vēlreiz, lai dzēstu'; setTimeout(() => { armed = false; if ($('pDel')) $('pDel').textContent = 'Dzēst'; }, 3000); return false; }
  draw();
}
function drawAdminSheet() { sheet(''); drawAdmin(); }

/* ---------- Starts ---------- */
(async function boot() {
  if (!S.t) { show('vLogin'); setTimeout(() => $('pin').focus(), 200); return; }
  try { S.me = JSON.parse(ls.get('sh_me') || 'null'); } catch (e) {}
  if (S.me) { home(); const k = location.hash.slice(1); if (APPS[k]) openApp(k, true); }
  try { const r = await api('me'); S.me = r.me; S.dash = r.dash; ls.set('sh_me', JSON.stringify(r.me)); const pin = ls.get('sh_pin'); if (pin) sso(pin);
    if ($('vApp').hidden) { home(); const k = location.hash.slice(1); if (APPS[k]) openApp(k, true); } maybeTour(); }
  catch (e) { if (e.code === 'auth') return logout(); if (!S.me) { show('vLogin'); toast(netMsg(e), 'err'); } }
})();
setInterval(() => { if (S.me && !document.hidden && !$('vHome').hidden) refresh(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && !$('vHome').hidden) refresh(true); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
function maybeTour() { if (window.SHXR) SHXR.maybeTour(); }
</script>
<script>
window.SHX = { app: 'portal', external: true, a2hs: true,
  getUser: function () { return S.me ? { name: S.me.name, kind: S.me.admin ? 'admin' : 'lietotajs' } : null; },
  homeTab: function () { return ''; },
  tours: {
    lietotajs: [
      { title: 'Sveiki portālā!', text: 'Visas jūsu darba lietotnes ir vienuviet, ar vienu PIN. Pusminūtes pamācība.' },
      { sel: '#tiles .tile', title: 'Lietotnes', text: 'Katrā kartītē redzams svarīgākais — piemēram, cik darbu gaida. Uzspiediet, lai atvērtu.' },
      { sel: '#refreshBtn', title: 'Atjaunot', text: 'Skaitļi atjaunojas paši ik minūti, bet varat atjaunot arī uzreiz.' },
      { sel: '#menuBtn', title: 'Izvēlne', text: 'Pamācība, tumšais režīms, pievienošana sākuma ekrānam un iziešana.' },
      { title: 'Viss gatavs!', text: 'Lietotnē augšā ir poga «Sākums» un ikonas ātrai pārslēgšanai. Veiksmīgu darbu!' }
    ]
  }
};
SHX.tours.admin = SHX.tours.lietotajs.slice(0, 2).concat([{ sel: '#admTile', title: 'Administrēšana', text: 'Viens saraksts visām lietotnēm: cilvēki un PIN, pilnvaras, objekti, uzņēmumi un saraksti. Maini šeit — mainās visur.' }], SHX.tours.lietotajs.slice(2));
</script>
<script src="sh-addon.js?v=1"></script>
</body>
</html>
